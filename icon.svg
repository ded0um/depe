<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la bordure fine en rouge/dépense (#c5221f -> #991b1b) -->
    <linearGradient id="expense-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5221f"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Fond circulaire clair (#ffffff) -->
    <linearGradient id="expense-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Ombre interne légère -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.12" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Fond plein carré : couleur du fond de page (#f1f5f9) pour masque PWA -->
  <rect width="512" height="512" fill="#f1f5f9"/>

  <!-- Zone sûre maskable (scale 0.78) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Anneau extérieur (bordure rouge intense) -->
    <circle cx="256" cy="256" r="248" fill="url(#expense-border)"/>

    <!-- Fond intérieur blanc carte -->
    <circle cx="256" cy="256" r="238" fill="url(#expense-bg)" filter="url(#inner-shadow)"/>

    <!-- Texte du haut : SUIVI / DÉPENSES -->
    <text x="256" y="115"
          text-anchor="middle"
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-weight="800"
          font-size="64"
          letter-spacing="4"
          fill="#0f172a">SUIVI</text>
    <text x="256" y="195"
          text-anchor="middle"
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-weight="800"
          font-size="64"
          letter-spacing="4"
          fill="#c5221f">DÉPENSES</text>

    <!-- Illustration centrale : courbe de dépense -->
    <g transform="translate(136, 180)">
      <path d="M 50 120 L 90 95 L 130 110 L 180 80" fill="none" stroke="#c5221f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="180" cy="80" r="7" fill="#c5221f"/>
    </g>

    <!-- Texte DEDOUM en bas -->
    <text x="256" y="442"
          text-anchor="middle"
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-weight="900"
          font-size="54"
          letter-spacing="4"
          fill="#475569">DEDOUM</text>
  </g>
</svg>
