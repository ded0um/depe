<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Dépenses</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --checked: #475569;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px 90px 16px;
      background: var(--bg);
      color: var(--text);
    }

    /* Carte de résumé du haut */
    .summary-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .summary-card .label {
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .summary-card .amount {
      font-size: 42px;
      font-weight: 800;
      margin-top: 8px;
      color: var(--primary);
    }

    /* Titres de sections */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin: 24px 0 10px 4px;
    }

    /* Liste des dépenses */
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    li:active {
      background: #283548;
    }
    
    li.done {
      opacity: 0.45;
      background: #111827;
      border-color: #1f2937;
    }
    li.done .desc { text-decoration: line-through; }
    li.done .amount-tag { color: var(--checked); }

    .item-left {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .info .desc { font-weight: 600; font-size: 16px; color: var(--text); }
    .info .date-tag { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
    
    .right-side { display: flex; align-items: center; gap: 12px; }
    .amount-tag { font-weight: 700; font-size: 17px; color: var(--primary); }
    
    .btn-del {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      padding: 8px;
      border-radius: 8px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-del:active { color: var(--primary); background: #334155; }

    /* Bouton Flottant (FAB) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 32px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
      cursor: pointer;
      z-index: 100;
    }
    .fab-btn:active { transform: scale(0.95); background: var(--primary-hover); }

    /* Surfenêtre / Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.open { display: flex; }

    .modal-content {
      background: var(--card);
      border-top: 1px solid var(--card-border);
      border-radius: 24px 24px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 18px; margin: 0; font-weight: 700; color: var(--text); }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; padding: 4px; }

    .form-grid { display: flex; flex-direction: column; gap: 12px; }
    
    input, select {
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 16px;
      color: var(--text);
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }
    select {
      background-image: url("data:image/svg+xml;utf8,<svg fill='%94a3b8' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    option {
      background: #0f172a;
      color: var(--text);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    button.btn-add {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      padding: 16px;
      border-radius: 12px;
      margin-top: 8px;
    }
    button.btn-add:active { background: var(--primary-hover); }

    iframe { display: none; }
  </style>
</head>
<body>

  <!-- Résumé direct -->
  <div class="summary-card">
    <div class="label">Reste à passer sur le compte</div>
    <div class="amount" id="totalAVenir">0.00 €</div>
  </div>

  <div class="section-title">Opérations à venir</div>
  <ul id="listPending"></ul>

  <div class="section-title" style="margin-top: 30px;">Opérations passées</div>
  <ul id="listDone"></ul>

  <!-- Bouton Flottant (FAB) -->
  <button class="fab-btn" onclick="openModal()">+</button>

  <!-- Surfenêtre (Modal) pour ajouter une dépense -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Nouvelle dépense</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="form-grid">
        <input type="text" id="description" placeholder="Libellé (ex: Loyer, Forfait...)">
        <input type="number" step="0.01" id="montant" placeholder="Montant (€)" inputmode="decimal">
        
        <select id="frequence" onchange="toggleDateInput()">
          <option value="ponctuelle">Ponctuel</option>
          <option value="mensuelle">Mensuel</option>
        </select>
        
        <div id="dateContainer">
          <input type="text" id="dateExacteText" placeholder="Date (ex: 25/09/2026)" inputmode="numeric" maxlength="10" oninput="formatDateInput(this)">
        </div>
        <div id="jourContainer" style="display: none;">
          <input type="number" id="jourMois" min="1" max="31" placeholder="Jour du mois (ex: 1, 5, 15...)" inputmode="numeric">
        </div>

        <button class="btn-add" onclick="addItem()">Ajouter la dépense</button>
      </div>
    </div>
  </div>

  <!-- Formulaire invisible pour envoi en arrière-plan -->
  <form id="hiddenForm" action="https://script.google.com/macros/s/AKfycbz7QrZuIP_SfbxpdWhdQVAVVDXGLYEZCdwqk6FeGwVvhVk195ucG_NoxSo-M3te4sCHYA/exec" method="POST" target="hiddenIframe">
    <input type="hidden" name="action" id="formAction">
    <input type="hidden" name="id" id="formId">
    <input type="hidden" name="description" id="formDesc">
    <input type="hidden" name="montant" id="formMontant">
    <input type="hidden" name="categorie" id="formCat" value="Autre">
    <input type="hidden" name="frequence" id="formFreq">
    <input type="hidden" name="dateVal" id="formDateVal">
  </form>

  <iframe name="hiddenIframe" id="hiddenIframe"></iframe>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz7QrZuIP_SfbxpdWhdQVAVVDXGLYEZCdwqk6FeGwVvhVk195ucG_NoxSo-M3te4sCHYA/exec";
    let localItems = [];

    function openModal() {
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function closeModalOutside(event) {
      if (event.target.id === 'modalOverlay') closeModal();
    }

    function toggleDateInput() {
      const freq = document.getElementById('frequence').value;
      if (freq === 'mensuelle') {
        document.getElementById('dateContainer').style.display = 'none';
        document.getElementById('jourContainer').style.display = 'block';
      } else {
        document.getElementById('dateContainer').style.display = 'block';
        document.getElementById('jourContainer').style.display = 'none';
      }
    }

    // Formatage automatique pendant la frappe (ex: 25092026 -> 25/09/2026)
    function formatDateInput(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 2 && v.length <= 4) {
        input.value = v.slice(0, 2) + '/' + v.slice(2);
      } else if (v.length > 4) {
        input.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4, 8);
      } else {
        input.value = v;
      }
    }

    // Convertit "AAAA-MM-JJ" ou "JJ/MM/AAAA" en Timestamp pour le tri
    function getNextDueDateTimestamp(item) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      if (item.frequence === 'mensuelle') {
        const targetDay = parseInt(item.dateVal, 10);
        if (isNaN(targetDay)) return Infinity;

        let targetDate = new Date(today.getFullYear(), today.getMonth(), targetDay);
        if (targetDate < today) {
          targetDate = new Date(today.getFullYear(), today.getMonth() + 1, targetDay);
        }
        return targetDate.getTime();
      } else if (item.dateVal) {
        let parts = [];
        if (item.dateVal.includes('/')) {
          parts = item.dateVal.split('/');
          if (parts.length === 3) {
            const targetDate = new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
            return targetDate.getTime();
          }
        } else if (item.dateVal.includes('-')) {
          parts = item.dateVal.split('-');
          if (parts.length === 3) {
            const targetDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            return targetDate.getTime();
          }
        }
      }
      return Infinity;
    }

    function formatDateDisplay(item) {
      if (item.frequence === 'mensuelle') {
        return `Tous les ${item.dateVal} du mois`;
      } else if (item.dateVal) {
        if (item.dateVal.includes('-')) {
          const parts = item.dateVal.split('-');
          if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
          }
        }
        return item.dateVal;
      }
      return '';
    }

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?cache=" + Date.now());
        const data = await response.json();
        localItems = data.items;
        updateUI();
      } catch (err) {
        console.error("Erreur :", err);
      }
    }

    function updateUI() {
      let totalAVenir = 0;

      localItems.forEach(i => {
        if (!i.fait) totalAVenir += i.montant;
      });

      document.getElementById('totalAVenir').innerText = totalAVenir.toFixed(2) + " €";

      localItems.sort((a, b) => getNextDueDateTimestamp(a) - getNextDueDateTimestamp(b));

      const pendingEl = document.getElementById('listPending');
      const doneEl = document.getElementById('listDone');
      
      pendingEl.innerHTML = '';
      doneEl.innerHTML = '';

      const pendingItems = localItems.filter(i => !i.fait);
      const doneItems = localItems.filter(i => i.fait);

      if (pendingItems.length === 0) {
        pendingEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; padding: 10px 0;">Aucune opération à venir.</p>';
      } else {
        pendingItems.forEach(item => pendingEl.appendChild(createItemElement(item)));
      }

      if (doneItems.length === 0) {
        doneEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; padding: 10px 0;">Aucune opération passée.</p>';
      } else {
        doneItems.forEach(item => doneEl.appendChild(createItemElement(item)));
      }
    }

    function createItemElement(item) {
      const li = document.createElement('li');
      if (item.fait) li.classList.add('done');
      
      li.onclick = () => toggleItem(item.id);

      const dateTxt = formatDateDisplay(item);

      li.innerHTML = `
        <div class="item-left">
          <div class="info">
            <span class="desc">${item.description}</span>
            ${dateTxt ? `<span class="date-tag">${dateTxt}</span>` : ''}
          </div>
        </div>
        <div class="right-side">
          <span class="amount-tag">-${item.montant.toFixed(2)} €</span>
          <button class="btn-del" onclick="deleteItem('${item.id}', event)" title="Supprimer">🗑️</button>
        </div>
      `;
      return li;
    }

    function submitForm(action, data = {}) {
      document.getElementById('formAction').value = action;
      document.getElementById('formId').value = data.id || '';
      document.getElementById('formDesc').value = data.description || '';
      document.getElementById('formMontant').value = data.montant || '';
      document.getElementById('formFreq').value = data.frequence || '';
      document.getElementById('formDateVal').value = data.dateVal || '';

      document.getElementById('hiddenForm').submit();
    }

    function addItem() {
      const descInput = document.getElementById('description');
      const amountInput = document.getElementById('montant');
      const freqSelect = document.getElementById('frequence');

      const desc = descInput.value.trim();
      const amount = parseFloat(amountInput.value);
      const freq = freqSelect.value;
      
      let dateVal = '';
      if (freq === 'mensuelle') {
        dateVal = document.getElementById('jourMois').value;
      } else {
        dateVal = document.getElementById('dateExacteText').value.trim();
      }

      if (!desc || isNaN(amount)) {
        alert("Merci d'indiquer un libellé et un montant valide.");
        return;
      }

      const newId = Date.now().toString();
      const newItem = {
        id: newId,
        description: desc,
        montant: amount,
        categorie: 'Autre',
        fait: false,
        frequence: freq,
        dateVal: dateVal
      };

      localItems.push(newItem);
      updateUI();

      descInput.value = '';
      amountInput.value = '';
      document.getElementById('dateExacteText').value = '';
      document.getElementById('jourMois').value = '';

      closeModal();
      submitForm('add', newItem);
    }

    function toggleItem(id) {
      const item = localItems.find(i => i.id.toString() === id.toString());
      if (item) {
        item.fait = !item.fait;
        updateUI();
        submitForm('toggle', { id: id });
      }
    }

    function deleteItem(id, event) {
      if (event) event.stopPropagation();
      if (!confirm("Supprimer cette dépense ?")) return;

      localItems = localItems.filter(i => i.id.toString() !== id.toString());
      updateUI();
      submitForm('delete', { id: id });
    }

    loadData();
  </script>
</body>
</html>
