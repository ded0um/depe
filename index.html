<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dépenses</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #bb86fc;
      --text-color: #e0e0e0;
      --danger-color: #cf6679;
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .auth-card, .form-card, .list-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #aaa;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #2b2b2b;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .expense-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .expense-title {
      font-weight: bold;
    }

    .expense-sub {
      font-size: 0.8rem;
      color: #888;
    }

    .expense-amount {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: none;
      width: auto;
      padding: 4px 8px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .total-container {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: right;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid var(--border-color);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gestion des Dépenses</h1>

    <!-- Identification Utilisateur -->
    <div class="auth-card" id="authSection">
      <div class="form-group">
        <label for="userEmailInput">Adresse E-mail</label>
        <input type="email" id="userEmailInput" placeholder="exemple@gmail.com" required>
      </div>
      <button onclick="setUserEmail()">Connexion</button>
    </div>

    <!-- Application principale -->
    <div id="appSection" class="hidden">
      
      <!-- Formulaire d'ajout -->
      <div class="form-card">
        <h3>Ajouter une dépense</h3>
        <form id="addExpenseForm" onsubmit="handleAddExpense(event)">
          <div class="form-group">
            <label for="expDate">Date</label>
            <input type="date" id="expDate" required>
          </div>
          <div class="form-group">
            <label for="expType">Type</label>
            <select id="expType">
              <option value="Dépense">Dépense</option>
              <option value="Revenu">Revenu</option>
            </select>
          </div>
          <div class="form-group">
            <label for="expCategory">Catégorie</label>
            <input type="text" id="expCategory" placeholder="Alimentation, Transport..." required>
          </div>
          <div class="form-group">
            <label for="expDescription">Description</label>
            <input type="text" id="expDescription" placeholder="Courses, Essence..." required>
          </div>
          <div class="form-group">
            <label for="expAmount">Montant (€)</label>
            <input type="number" step="0.01" id="expAmount" placeholder="0.00" required>
          </div>
          <button type="submit" id="submitBtn">Ajouter</button>
        </form>
      </div>

      <!-- Liste des dépenses -->
      <div class="list-card">
        <h3>Historique</h3>
        <div id="expenseList">Chargement...</div>
        <div class="total-container">
          Total : <span id="totalAmount">0.00</span> €
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzHBRm4ae3tST4Gc7bb2sXxPyqfLm1CiPGaivKfH3LXqz9GoXKfOjjF3SdJxlWUd1ulqQ/exec";
    let userEmail = localStorage.getItem("userEmail") || "";

    // Initialisation
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("expDate").valueAsDate = new Date();
      if (userEmail) {
        document.getElementById("userEmailInput").value = userEmail;
        showApp();
      }
    });

    function setUserEmail() {
      const emailInput = document.getElementById("userEmailInput").value.trim();
      if (!emailInput) {
        alert("Veuillez saisir un e-mail valide.");
        return;
      }
      userEmail = emailInput;
      localStorage.setItem("userEmail", userEmail);
      showApp();
    }

    function showApp() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("appSection").classList.remove("hidden");
      loadData();
    }

    async function loadData() {
      if (!userEmail) return;

      const expenseList = document.getElementById("expenseList");
      expenseList.innerHTML = "Chargement des données...";

      const targetUrl = `${API_URL}?email=${encodeURIComponent(userEmail)}&cache=${Date.now()}`;

      try {
        const response = await fetch(targetUrl, {
          method: "GET",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error(`Erreur réseau : ${response.status}`);
        }

        const data = await response.json();
        updateUI(data);

      } catch (error) {
        console.error("Erreur de chargement :", error);
        expenseList.innerHTML = `<p style="color: var(--danger-color);">Erreur de chargement des données.</p>`;
      }
    }

    function updateUI(data) {
      const expenseList = document.getElementById("expenseList");
      const totalAmountEl = document.getElementById("totalAmount");

      // Sécurité : vérification qu'il s'agit bien d'un tableau
      if (!Array.isArray(data)) {
        console.error("Données reçues invalides (attendu : Array) :", data);
        expenseList.innerHTML = "<p>Aucune donnée disponible.</p>";
        totalAmountEl.textContent = "0.00";
        return;
      }

      if (data.length === 0) {
        expenseList.innerHTML = "<p>Aucune dépense enregistrée.</p>";
        totalAmountEl.textContent = "0.00";
        return;
      }

      expenseList.innerHTML = "";
      let total = 0;

      data.forEach(item => {
        const amount = parseFloat(item.amount) || 0;
        if (item.type === "Revenu") {
          total += amount;
        } else {
          total -= amount;
        }

        const itemEl = document.createElement("div");
        itemEl.className = "expense-item";
        itemEl.innerHTML = `
          <div class="expense-info">
            <span class="expense-title">${escapeHtml(item.description)}</span>
            <span class="expense-sub">${escapeHtml(item.category)} • ${formatDate(item.date)}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="expense-amount" style="color: ${item.type === 'Revenu' ? '#03dac6' : '#fff'}">
              ${item.type === 'Revenu' ? '+' : '-'}${Math.abs(amount).toFixed(2)} €
            </span>
            <button class="btn-delete" onclick="deleteExpense(${item.rowIndex})">✕</button>
          </div>
        `;
        expenseList.appendChild(itemEl);
      });

      totalAmountEl.textContent = total.toFixed(2);
    }

    async function handleAddExpense(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Enregistrement...";

      const date = document.getElementById("expDate").value;
      const type = document.getElementById("expType").value;
      const category = document.getElementById("expCategory").value.trim();
      const description = document.getElementById("expDescription").value.trim();
      const amount = document.getElementById("expAmount").value;

      const params = new URLSearchParams({
        action: "add",
        email: userEmail,
        date: date,
        type: type,
        category: category,
        description: description,
        amount: amount
      });

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: params.toString()
        });

        if (response.ok) {
          document.getElementById("expDescription").value = "";
          document.getElementById("expAmount").value = "";
          await loadData();
        } else {
          alert("Erreur lors de l'ajout.");
        }
      } catch (error) {
        console.error("Erreur POST :", error);
        alert("Impossible d'ajouter la dépense.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Ajouter";
      }
    }

    async function deleteExpense(rowIndex) {
      if (!confirm("Supprimer cette ligne ?")) return;

      const params = new URLSearchParams({
        action: "delete",
        rowIndex: rowIndex
      });

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: params.toString()
        });

        if (response.ok) {
          await loadData();
        } else {
          alert("Erreur lors de la suppression.");
        }
      } catch (error) {
        console.error("Erreur suppression :", error);
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString("fr-FR");
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, match => {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return map[match];
      });
    }
  </script>
</body>
</html>
